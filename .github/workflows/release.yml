name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    # This fork is distributed by reviewed Git SHA, never by a public release.
    if: ${{ github.repository != '10krco/pi-sandbox' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true

  publish-npm:
    if: ${{ github.repository != '10krco/pi-sandbox' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish --no-git-checks
